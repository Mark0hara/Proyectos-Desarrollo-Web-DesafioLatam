<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Arriendos{% endblock %}</title>
    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body { background-color: #f8f9fa; }
        .navbar { box-shadow: 0 2px 4px rgba(0,0,0,.1); }
        
        /* TRUCO: Hacer que form.as_p de Django se vea como Bootstrap */
        form p { margin-bottom: 1rem; }
        form input[type="text"], form input[type="email"], form input[type="password"], 
        form select, form textarea {
            display: block; width: 100%; padding: 0.375rem 0.75rem; font-size: 1rem;
            line-height: 1.5; color: #212529; background-color: #fff;
            border: 1px solid #ced4da; border-radius: 0.375rem; 
        }
        form input:focus { border-color: #86b7fe; outline: 0; box-shadow: 0 0 0 0.25rem rgba(13,110,253,.25); }
        form label { display: inline-block; margin-bottom: 0.5rem; font-weight: 500; }
        .helptext { display: block; margin-top: 0.25rem; font-size: 0.875em; color: #6c757d; }
        .errorlist { color: #dc3545; padding-left: 0; list-style: none; font-size: 0.875em;}
    </style>
</head>
<body>
    <!-- Barra de Navegación -->
    <nav class="navbar navbar-expand-lg navbar-dark bg-primary mb-4">
        <div class="container">
            <a class="navbar-brand fw-bold" href="{% url 'perfil' %}">🏠 Portal de Arriendos</a>
            <div class="d-flex">
                {% if user.is_authenticated %}
                    <span class="navbar-text text-white me-3">Hola, {{ user.username }}</span>
                    <a href="{% url 'logout' %}" class="btn btn-outline-light btn-sm">Cerrar Sesión</a>
                {% else %}
                    <a href="{% url 'login' %}" class="btn btn-outline-light btn-sm me-2">Iniciar Sesión</a>
                    <a href="{% url 'registro' %}" class="btn btn-light btn-sm">Registrarse</a>
                {% endif %}
            </div>
        </div>
    </nav>

    <div class="container">
        {% block content %}{% endblock %}
    </div>

    <!-- Bootstrap JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
