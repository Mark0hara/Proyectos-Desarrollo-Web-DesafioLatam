{% extends 'usuarios/base.html' %}
{% block title %}Eliminar Inmueble{% endblock %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-md-6">
        <div class="card shadow-sm border-danger">
            <div class="card-body p-4 text-center">
                <h3 class="text-danger">⚠️ Confirmar Eliminación</h3>
                <p>¿Estás seguro que deseas borrar <strong>{{ inmueble.titulo }}</strong>?</p>
                <p class="text-muted">Esta acción no se puede deshacer.</p>
                <form method="post">
                    {% csrf_token %}
                    <a href="{% url 'listar_inmuebles' %}" class="btn btn-secondary">Cancelar</a>
                    <button type="submit" class="btn btn-danger">Sí, Borrar</button>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
