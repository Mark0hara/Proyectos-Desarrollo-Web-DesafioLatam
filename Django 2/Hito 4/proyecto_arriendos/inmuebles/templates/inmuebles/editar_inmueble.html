{% extends 'usuarios/base.html' %}
{% block title %}Editar Inmueble{% endblock %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-md-8">
        <div class="card shadow-sm">
            <div class="card-body p-4">
                <h3 class="card-title mb-4">✏️ Editar: {{ inmueble.titulo }}</h3>
                <form method="post">
                    {% csrf_token %}
                    {{ form.as_p }}
                    <button type="submit" class="btn btn-warning w-100 mt-3">Actualizar Inmueble</button>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
